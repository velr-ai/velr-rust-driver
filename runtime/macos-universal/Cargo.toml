[package]
name = "velr-runtime-macos-universal"
version = "0.2.47"
edition = "2021"

description = "Velr native runtime for macOS universal"
license-file = "LICENSE.runtime"
homepage = "https://velr.ai"
repository = "https://github.com/velr-ai/velr-rust-driver"
documentation = "https://docs.rs/velr"

include = ["src/**", "build.rs", "prebuilt/libvelrc.dylib.xz", "Cargo.toml", "LICENSE.runtime"]

[build-dependencies]
lzma-rs = "0.3"

[lib]
name = "velr_runtime_macos_universal"
path = "src/lib.rs"
