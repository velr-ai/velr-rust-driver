[package]
name = "velr-runtime-windows-x86_64"
version = "0.2.61"
edition = "2021"

description = "Velr native runtime for Windows x86_64 MSVC"
license-file = "LICENSE.runtime"
homepage = "https://velr.ai"
repository = "https://github.com/velr-ai/velr-rust-driver"
documentation = "https://docs.rs/velr"

include = ["src/**", "prebuilt/**", "build.rs", "Cargo.toml", "LICENSE.runtime"]

[build-dependencies]
zstd = { version = "0.13", default-features = false }

[lib]
name = "velr_runtime_windows_x86_64"
path = "src/lib.rs"
